# CI — à chaque push sur main et sur chaque PR : lint, typecheck, build, tests
# unitaires, puis tests de bout en bout (DEP-025, DEP-026, DEP-027).
#
# Publication npm : sur un tag v* (`npm version patch && git push --follow-tags`),
# et SEULEMENT si les deux jobs de vérification passent (needs:). Aucun secret
# (DEP-034) : publication de confiance npm (OIDC). À déclarer une fois sur
# npmjs.com → physalis-cli → Settings → Trusted publisher : GitHub Actions,
# physalis-cloud/physalis-cli, workflow ci.yml.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    name: Lint, typecheck, tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e

  publier:
    name: Publication npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verifier, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC : npm délivre un jeton à usage unique, et la provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Le tag correspond à la version du package.json
        run: test "refs/tags/v$(node -p 'require("./package.json").version')" = "$GITHUB_REF"
      # Publication de confiance : npm ≥ 11.5.1, livré avec Node 24.
      - run: npm publish --access public
